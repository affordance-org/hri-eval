name: Request a feature
description: Ask for a policy interface, an observation, a score or a tool the eval does not have yet.
title: "[Feature] "
labels: ["request", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        The list of what exists today and what is on request is in [docs/catalog.md](https://github.com/affordance-org/hri-eval/blob/main/docs/catalog.md).
        If your feature is on that list as "On request", this is the right form. If it is not on the list, this is also the right form.
        Everything you write here is public.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Policy interface (actions, adapters, bridges)
        - Observations (cameras, sensors, person state)
        - People and rooms (reactive people, more recordings, your own room)
        - Scores
        - Tooling (CLI, reports, viewer, batch runs)
        - Evaluation service (leaderboard, real-robot replay)
        - Other
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature in one line
      placeholder: A websocket policy server so my policy can run on a GPU machine.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you want to test with it?
      description: The question you want the eval to answer once this exists.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What should it look like?
      description: Field names, message format, units, rates, a code sketch. Anything that helps us build the version you need.
      render: python
  - type: dropdown
    id: robot
    attributes:
      label: Your robot
      options:
        - Unitree G1 with two UMI grippers (available today)
        - Unitree G1 with Dex3 hands
        - Unitree H1
        - Fourier GR-1
        - Mobile manipulator (Hello Robot Stretch or similar)
        - My own URDF or MJCF
        - Other (write it below)
    validations:
      required: true
  - type: dropdown
    id: policy_type
    attributes:
      label: Your policy type
      multiple: true
      options:
        - Joint level (ControlOutput, available today)
        - Command level (CommandPolicy, available today)
        - End-effector pose actions
        - Vision or VLA policy (needs camera images)
        - LeRobot policy
        - ROS 2 stack
        - Classical planner and controller
        - Other (write it below)
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: How would you use it?
      description: For example a paper, a regression test before a demo, comparing models, a safety review.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: A GitHub handle is enough. For private contact use https://affordance.homes.
