name: Request a robot
description: Ask for another robot or hand, or for your own URDF or MJCF model, in the eval.
title: "[Robot] "
labels: ["request", "robot"]
body:
  - type: markdown
    attributes:
      value: |
        Today the eval has one robot: a Unitree G1 (29 joints) with two UMI parallel grippers.
        Tell us which robot you want and we will add it in the order people ask.
        Everything you write here is public. Do not attach private models; contact us through https://affordance.homes instead.
  - type: dropdown
    id: robot
    attributes:
      label: Robot
      options:
        - Unitree G1 with Dex3 hands
        - Unitree H1
        - Fourier GR-1
        - Mobile manipulator (Hello Robot Stretch or similar)
        - My own URDF or MJCF
        - Other (write it below)
    validations:
      required: true
  - type: input
    id: robot_name
    attributes:
      label: Robot name and version
      placeholder: Unitree H1-2, or "our arm on a mobile base"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Link to the URDF or MJCF (optional)
      description: A public repository or file. Leave empty if the model is private.
  - type: textarea
    id: actuation
    attributes:
      label: Hands, grippers and actuators
      description: End effectors, joint count, torque limits, and the walking or base controller you use (if any).
  - type: textarea
    id: what
    attributes:
      label: What do you want to test?
      description: Which scenario (point-fetch or another one) and what counts as success for you.
    validations:
      required: true
  - type: dropdown
    id: policy_type
    attributes:
      label: Your policy type
      multiple: true
      options:
        - Joint level (ControlOutput, available today)
        - Command level (CommandPolicy, available today)
        - End-effector pose actions
        - Vision or VLA policy (needs camera images)
        - LeRobot policy
        - ROS 2 stack
        - Classical planner and controller
        - Other (write it below)
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: How would you use it?
      description: For example a paper, a regression test before a demo, comparing models, a safety review.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: A GitHub handle is enough. For private contact use https://affordance.homes.
